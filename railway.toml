# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Phải bọc trong `sh -c`: Railway chạy startCommand KHÔNG qua shell, nên viết
# thẳng `--port $PORT` thì uvicorn nhận đúng chuỗi "$PORT" và chết với
# `Invalid value for '--port': '$PORT' is not a valid integer`.
# `${PORT:-8000}` để vẫn chạy được cả khi platform chưa gán PORT.
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
